       <div data-template-id="question-card-15" class="canva-card rounded-[1.7rem] border-2 border-[#c9d9ac] p-6 shadow-lg sm:p-8"><span data-template-id="question-number-15" class="canva-tag rounded-full px-3 py-1 font-extrabold"></span>
        <h2 data-template-id="question-15" class="canva-text mt-4 font-extrabold leading-snug"></h2>
        <div class="mt-6 grid gap-3"><button data-template-id="q15-a" class="canva-button option rounded-xl p-4 text-left font-bold" data-answer="0"></button><button data-template-id="q15-b" class="canva-button option rounded-xl p-4 text-left font-bold" data-answer="1"></button><button data-template-id="q15-c" class="canva-button option rounded-xl p-4 text-left font-bold" data-answer="2"></button><button data-template-id="q15-d" class="canva-button option rounded-xl p-4 text-left font-bold" data-answer="3"></button>
        </div>
       </div>
      </article>
     </div>
     <aside id="feedback-panel" class="mt-5 hidden rounded-2xl border-2 p-5" aria-live="polite">
      <p id="feedback-icon" class="m-0 text-2xl"></p>
      <p id="feedback-message" class="mt-1 text-lg font-extrabold"></p>
      <p id="feedback-detail" class="mt-1"></p><button id="next-button" data-template-id="next-button" class="canva-button mt-4 inline-flex items-center gap-2 rounded-xl px-5 py-3 font-bold shadow-[0_4px_0_#173c32]"><span data-template-id="next-button-text" class="canva-text"></span><i data-lucide="arrow-right"></i></button> <button id="result-button" data-template-id="result-button" class="canva-button mt-4 hidden inline-flex items-center gap-2 rounded-xl px-5 py-3 font-bold shadow-[0_4px_0_#173c32]"><span data-template-id="result-button-text" class="canva-text"></span><i data-lucide="trophy"></i></button>
     </aside>
    </section>
    <section id="result-screen" class="screen">
     <div data-template-id="result-card" class="canva-card rounded-[2rem] border-4 border-[#173c32] p-7 text-center shadow-[10px_10px_0_#e76f51] sm:p-11">
      <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-[#95c11f] text-4xl shadow-md">
       🏆
      </div>
      <p data-template-id="result-kicker" class="canva-text mt-6 font-extrabold uppercase tracking-[.17em]"></p>
      <h1 data-template-id="result-title" class="canva-text adventure-title mt-2 font-bold"></h1>
      <p id="result-name" class="mt-3 text-lg font-bold"></p>
      <p id="achievement-message" class="mt-2 text-xl font-extrabold text-[#2d6a4f]"></p>
      <div class="mx-auto mt-7 grid max-w-2xl grid-cols-3 gap-3">
       <div class="rounded-2xl bg-[#dff3c7] p-4">
        <p data-template-id="result-correct-label" class="canva-text m-0 font-bold uppercase"></p>
        <p id="result-correct" class="mt-1 text-3xl font-extrabold">0</p>
       </div>
       <div class="rounded-2xl bg-[#ffe0d8] p-4">
        <p data-template-id="result-wrong-label" class="canva-text m-0 font-bold uppercase"></p>
        <p id="result-wrong" class="mt-1 text-3xl font-extrabold">0</p>
       </div>
       <div class="rounded-2xl bg-[#173c32] p-4 text-[#f6edcf]">
        <p data-template-id="result-score-label" class="canva-text m-0 font-bold uppercase"></p>
        <p id="result-score" class="mt-1 text-3xl font-extrabold">0</p>
       </div>
      </div>
      <p id="save-status" class="mt-6 font-bold" aria-live="polite"></p><button id="restart-button" data-template-id="restart-button" class="canva-button mt-5 inline-flex items-center gap-2 rounded-xl border-2 px-5 py-3 font-bold"><i data-lucide="rotate-ccw"></i><span data-template-id="restart-button-text" class="canva-text"></span></button>
     </div>
     <section data-template-id="leaderboard-section" class="canva-section mt-10 rounded-[2rem] border-2 border-[#c9d9ac] p-6 sm:p-8">
      <div class="flex items-center gap-3">
       <div class="rounded-xl bg-[#173c32] p-3 text-[#f6edcf]"><i data-lucide="medal"></i>
       </div>
       <div>
        <h2 data-template-id="leaderboard-title" class="canva-text m-0 font-extrabold"></h2>
        <p data-template-id="leaderboard-description" class="canva-text mt-1"></p>
       </div>
      </div>
      <div class="mt-5 grid grid-cols-[70px_1fr_90px] gap-2 rounded-xl bg-[#dff3c7] px-4 py-3 text-sm font-extrabold uppercase"><span>Peringkat</span><span>Nama</span><span class="text-right">Nilai</span>
      </div>
      <div id="leaderboard-list"></div>
      <p id="leaderboard-empty" data-template-id="leaderboard-empty" class="canva-text mt-5 rounded-xl bg-white/60 p-5 text-center"></p>

  <template id="leaderboard-row-template">
   <div data-template-id="leaderboard-row" class="canva-card leader-row grid grid-cols-[70px_1fr_90px] items-center gap-2 py-3">
    <span class="rank flex h-9 w-9 items-center justify-center rounded-full bg-[#dff3c7] font-extrabold"></span>
    <p class="row-name m-0 truncate font-extrabold"></p>
    <p class="row-score m-0 text-right text-xl font-extrabold"></p>
   </div>
  </template>
  <script src="/_sdk/0aac212797dcb9a6.editing_sdk.js" integrity="sha512-U1Z5TGB/MTX0fFSADhP7rVM3+UzJJjKTapiY1vm1cxcbcyWo4eBuCJNJO6zARJ5kHopP9UvWNtPszOqzRc1ICA=="></script>
  <script>
    const answers=[1,2,2,0,1,2,2,0,1,1,2,0,0,2,0];
    const feedbacks=[
      "Ekosistem terbentuk karena adanya hubungan antara makhluk hidup dan lingkungannya.",
      "Pohon mangga dan burung adalah komponen biotik karena merupakan makhluk hidup.",
      "Tumbuhan hijau membuat makanan sendiri, sehingga disebut produsen.",
      "Rumput berperan sebagai produsen dalam rantai makanan tersebut.",
      "Sapi memakan rumput, sehingga termasuk herbivora.",
      "Ayam memakan biji-bijian dan hewan kecil, sehingga termasuk omnivora.",
      "Jamur dan bakteri menguraikan sisa makhluk hidup.",
      "Pengurai membantu menyuburkan tanah.",
      "Air, tanah, dan cahaya matahari adalah komponen abiotik.",
      "Komponen biotik adalah makhluk hidup, sedangkan abiotik bukan makhluk hidup.",
      "Harimau merupakan konsumen dalam hubungan rantai makanan tersebut.",
      "Tanpa tumbuhan hijau, konsumen akan kekurangan sumber makanan.",
      "Jika tumbuhan air berkurang, ikan kemungkinan ikut terdampak.",
      "Jamur pada daun kering yang membusuk berperan sebagai pengurai.",
      "Tumbuhan membutuhkan cahaya matahari untuk membuat makanan."
    ];
    const totalQuestions=15;
    let currentQuestion=0,correctAnswers=0,playerName="",records=[],gameSaved=false,dataReady=false;
    const screens=document.querySelectorAll(".screen"),challenges=document.querySelectorAll(".challenge");
    function showScreen(id){screens.forEach(s=>s.classList.toggle("active",s.id===id))}
    function updateStatus(){
      document.getElementById("question-count").textContent=`Tantangan ${currentQuestion+1} dari ${totalQuestions}`;
      document.getElementById("header-progress").textContent=`${currentQuestion} / ${totalQuestions}`;
      document.getElementById("live-score").textContent=correctAnswers;
      document.getElementById("progress-bar").style.width=`${currentQuestion/totalQuestions*100}%`;
    }
    function showQuestion(index){
      challenges.forEach((c,i)=>c.classList.toggle("active",i===index));
      document.getElementById("feedback-panel").classList.add("hidden");
      document.getElementById("next-button").classList.toggle("hidden",index===totalQuestions-1);
      document.getElementById("result-button").classList.toggle("hidden",index!==totalQuestions-1);
      updateStatus();
    }
    function selectAnswer(button){
      const selected=Number(button.dataset.answer),correct=selected===answers[currentQuestion];
      const options=challenges[currentQuestion].querySelectorAll(".option");
      options.forEach(o=>{o.disabled=true;if(Number(o.dataset.answer)===answers[currentQuestion])o.classList.add("correct")});
      if(correct)correctAnswers++;
      else button.classList.add("incorrect");
      const panel=document.getElementById("feedback-panel");
      panel.className=`mt-5 rounded-2xl border-2 p-5 ${correct?"feedback-good":"feedback-try"}`;
      document.getElementById("feedback-icon").textContent=correct?"✨":"🧭";
      document.getElementById("feedback-message").textContent=correct?"Hebat! Jawabanmu benar!":"Coba lagi, kamu pasti bisa!";
      document.getElementById("feedback-detail").textContent=feedbacks[currentQuestion];
      document.getElementById("live-score").textContent=correctAnswers;
      document.getElementById("header-progress").textContent=`${currentQuestion+1} / ${totalQuestions}`;
      document.getElementById("progress-bar").style.width=`${(currentQuestion+1)/totalQuestions*100}%`;
      panel.classList.remove("hidden");
    }
    async function finishGame(){
      const wrong=totalQuestions-correctAnswers,score=Math.round(correctAnswers/totalQuestions*100);
      document.getElementById("result-name").textContent=`Petualang ${playerName}, kamu telah menyelesaikan semua tantangan!`;
      document.getElementById("result-correct").textContent=correctAnswers;
      document.getElementById("result-wrong").textContent=wrong;
      document.getElementById("result-score").textContent=score;
      document.getElementById("achievement-message").textContent=score>=90?"LUAR BIASA!":score>=80?"SANGAT BAIK!":score>=70?"BAIK!":"AYO BERLATIH LAGI!";
      showScreen("result-screen");renderLeaderboard();
      const status=document.getElementById("save-status");
      if(!dataReady){status.textContent="Hasil belum dapat disimpan. Sambungan Canva Sheets sedang tidak tersedia.";status.className="mt-6 font-bold text-[#a43b2a]";return}
      if(gameSaved)return;
      if(records.length>=999){status.textContent="Data permainan sudah penuh. Hapus hasil lama melalui Canva Sheets.";status.className="mt-6 font-bold text-[#a43b2a]";return}
      status.textContent="Menyimpan hasilmu ke Canva Sheets...";
      status.className="mt-6 font-bold text-[#785413]";
      const now=new Date();
      const result=await window.dataSdk.create({
        nama:playerName,
        tanggal:now.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}),
        waktu:now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}),
        jumlah_soal:totalQuestions,benar:correctAnswers,salah:wrong,nilai:score
      });
      if(result.isOk){gameSaved=true;status.textContent="Hasilmu sudah tersimpan di Canva Sheets dan masuk papan peringkat!";status.className="mt-6 font-bold text-[#28553a]"}
      else{status.textContent="Hasil belum tersimpan. Coba main lagi saat sambungan tersedia.";status.className="mt-6 font-bold text-[#a43b2a]"}
    }
    function renderLeaderboard(){
      const list=document.getElementById("leaderboard-list"),empty=document.getElementById("leaderboard-empty");
      const sorted=[...records].sort((a,b)=>b.nilai-a.nilai||b.benar-a.benar).slice(0,10);
      const existing=new Map([...list.children].map(el=>[el.dataset.id,el]));
      sorted.forEach((record,index)=>{
        let row=existing.get(record.__backendId);
        if(!row){const fragment=document.getElementById("leaderboard-row-template").content.cloneNode(true);row=fragment.querySelector("[data-template-id='leaderboard-row']");row.dataset.id=record.__backendId;list.appendChild(fragment)}
        row=list.querySelector(`[data-id="${record.__backendId}"]`);
        row.querySelector(".rank").textContent=index+1;row.querySelector(".row-name").textContent=record.nama;row.querySelector(".row-score").textContent=record.nilai;
        existing.delete(record.__backendId);
      });
      existing.forEach(el=>el.remove());empty.classList.toggle("hidden",sorted.length>0);
    }
    document.getElementById("start-form").addEventListener("submit",e=>{
      e.preventDefault();const input=document.getElementById("student-name");playerName=input.value.trim();
      if(!playerName){const error=document.getElementById("start-error");error.textContent="Tulis nama petualang terlebih dahulu.";error.classList.remove("hidden");input.focus();return}
      document.getElementById("start-error").classList.add("hidden");showScreen("game-screen");showQuestion(0);
    });
    document.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>selectAnswer(btn)));
    document.getElementById("next-button").addEventListener("click",()=>{currentQuestion++;showQuestion(currentQuestion)});
    document.getElementById("result-button").addEventListener("click",finishGame);
    document.getElementById("restart-button").addEventListener("click",()=>{
      currentQuestion=0;correctAnswers=0;playerName="";gameSaved=false;document.getElementById("student-name").value="";
      document.querySelectorAll(".option").forEach(o=>{o.disabled=false;o.classList.remove("correct","incorrect")});
      showScreen("welcome-screen");document.getElementById("student-name").focus();
    });
    const dataHandler={onDataChanged(data){records=data;renderLeaderboard()}};
    async function initializeData(){
      const result=await window.dataSdk.init(dataHandler);
      dataReady=result.isOk;
    }
    document.addEventListener("DOMContentLoaded",()=>{lucide.createIcons();initializeData()});
  </script>
 </body>
</html>
